<dialog class="confirm-dialog" id="{{ dialog_id }}{{ dialog_key }}" aria-labelledby="{{ dialog_id }}{{ dialog_key }}-title"><form method="post" action="{{ action }}">{% csrf_token %}<div class="confirm-dialog-icon" aria-hidden="true">!</div><p class="eyebrow">Confirm deletion</p><h2 id="{{ dialog_id }}{{ dialog_key }}-title">{{ title }}</h2><p>{{ text }}</p><div class="confirm-dialog-actions"><button class="button secondary" type="button" data-dialog-close>Cancel</button><button class="button danger-solid" type="submit">OK, delete</button></div></form></dialog>

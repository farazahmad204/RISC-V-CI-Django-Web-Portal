{# One analysis cell. Context: cell, row (plus can_edit). #}
<td class="analysis-value{% if can_edit %} editable{% endif %}{% if cell.source %} source-{{ cell.source }}{% endif %}{% if cell.column.key == 'ai_analysis' %} ai-col{% endif %}" data-column="{{ cell.column.id }}" data-result="{{ row.result.id }}" data-value="{{ cell.value }}"{% if cell.column.is_verdict %} data-verdict{% endif %} title="{% if cell.source == 'triage' %}Written by triage{% elif cell.updated_by %}Edited by {{ cell.updated_by.get_username }} on {{ cell.updated_at|date:'M d, Y H:i' }}{% elif can_edit %}Click to edit{% endif %}">{% if cell.column.is_verdict and cell.value %}<span class="verdict verdict-{{ cell.value|slugify }}">{{ cell.value }}</span>{% elif cell.value %}<div class="cell-text">{{ cell.value }}</div>{% else %}<span class="cell-empty">—</span>{% endif %}</td>
